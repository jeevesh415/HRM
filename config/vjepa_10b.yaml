# V-JEPA 10B Parameter Configuration
encoder:
  img_size: 224
  patch_size: [2, 16, 16]
  in_chans: 3
  embed_dim: 4096
  depth: 32
  num_heads: 32
  expansion: 4.0
  max_t: 16
  max_h: 14
  max_w: 14

predictor:
  # HRM Config
  H_cycles: 4
  L_cycles: 8
  H_layers: 12
  L_layers: 24
  hidden_size: 4096
  expansion: 4.0
  num_heads: 32
  pos_encodings: "rope"
  halt_max_steps: 8
  halt_exploration_prob: 0.1
  forward_dtype: "bfloat16"

  # 3D Gaussian Splatting
  use_gaussian_splatting: true
  num_gaussians: 256

  # Flow Matching (alternative/supplement to Neural ODE)
  use_flow_matching: true

  # Symplectic Integrator (for exact energy conservation at inference)
  use_symplectic: true

  # Test-Time Training
  use_ttt: true
  ttt_inner_lr: 0.1
  ttt_inner_steps: 1

  # Adaptive Depth
  adaptive_depth: true
  confidence_threshold: 0.95
  uncertainty_threshold: 0.7

  # Multi-modal Grounding
  use_multimodal: true
  audio_input_dim: 128
  tactile_input_dim: 64

training:
  batch_size: 1
  global_batch_size: 1024 # Target for multi-node training
  lr: 1e-4
  ema_momentum: 0.996
  sim_coeff: 25.0
  std_coeff: 25.0
  cov_coeff: 1.0
  weight_decay: 0.1

  # Optimizer: 'adamw', 'muon', or 'hybrid' (Muon for matrices, AdamW for biases/norms)
  optimizer: "hybrid"
  muon_momentum: 0.95
  muon_ns_steps: 5
